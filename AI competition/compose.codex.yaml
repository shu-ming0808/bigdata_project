services:
  backend:
    user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"
    environment:
      CODEX_HOME: /tmp/codex-home
      EXPLANATION_MODE: ${EXPLANATION_MODE:-codex}
    volumes:
      - type: bind
        source: ${CODEX_HOME:-${HOME}/.codex}/auth.json
        target: /tmp/codex-home/auth.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp/codex-home:uid=${DEMO_UID:-1000},gid=${DEMO_GID:-1000},mode=0700
