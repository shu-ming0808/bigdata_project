[project]
name = "ncu-ai-teacher-shortlisting"
version = "0.1.0"
description = "Evidence-based EMI teacher shortlisting competition prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
reports = [
    "matplotlib>=3.9,<4",
    "pillow>=10,<13",
    "reportlab>=4,<5",
]
notebook = [
    "ipykernel>=6.29,<8",
]

[tool.uv]
package = false
