[project]
name = "ncu-english-course-analysis"
version = "0.1.0"
description = "NCU undergraduate English-taught course pathways and supply analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
reports = [
    "matplotlib>=3.9,<4",
    "pillow>=10,<13",
    "reportlab>=4,<5",
]
notebook = [
    "ipykernel>=6.29,<8",
]

[tool.uv]
package = false
